pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'great-journey-mods'

include 'clanlands'
include 'clanwild'
include 'qa'          // TEST ONLY: the playtest harness mod, never shipped
include 'clanlore'    // Clan Lore: the Warrior Cats Events addon (roles, ceremonies, traits, the moon)
